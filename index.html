<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist de Cierre — Módulo 4</title>
<style>
  :root{
    --purple:#4000BC;
    --purple-light:#e9e2ff;
    --green:#05B605;
    --green-light:#dff7df;
    --bg:#FFFAFA;
    --ink:#1c1c1c;
    --muted:#6b6b6b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Poppins","Segoe UI",Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:0 0 3rem;
  }
  header{
    background:var(--purple);
    color:#fff;
    padding:1.2rem 1.6rem;
    display:flex;
    align-items:center;
    gap:1.2rem;
    flex-wrap:wrap;
  }
  header img{height:48px;width:auto;}
  header .title-block{flex:1;min-width:240px;}
  header h1{margin:0;font-size:1.3rem;font-weight:600;}
  header p.subject{margin:.25rem 0 0;font-size:.92rem;font-weight:500;opacity:.96;}
  header p.meta{margin:.2rem 0 0;font-size:.82rem;opacity:.88;}

  main{
    max-width:680px;
    margin:0 auto;
    padding:1.6rem 1.2rem;
    width:100%;
  }
  .intro{color:var(--muted);font-size:.92rem;margin:0 0 1.3rem;}

  .group{
    margin-bottom:1.3rem;
  }
  .group h2{
    font-size:.95rem;
    color:var(--purple);
    margin:0 0 .5rem;
  }
  .item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:.8rem;
    background:#fff;
    border:1px solid #eee0ff;
    border-radius:8px;
    padding:.7rem .9rem;
    margin-bottom:.5rem;
  }
  .item p{
    margin:0;
    font-size:.92rem;
    line-height:1.4;
  }
  .toggle{
    display:flex;
    gap:.4rem;
    flex-shrink:0;
  }
  .toggle button{
    border:1px solid #d5c6ff;
    background:#fff;
    color:var(--ink);
    border-radius:6px;
    padding:.35rem .7rem;
    font-size:.82rem;
    font-family:inherit;
    cursor:pointer;
  }
  .toggle button.active-yes{background:var(--green-light);border-color:#8fdc8f;color:#1c7a1c;font-weight:600;}
  .toggle button.active-no{background:#fff2f2;border-color:#e6a3a3;color:#c62828;font-weight:600;}

  .summary{
    margin-top:1.5rem;
    background:#fff;
    border:1px solid #eee0ff;
    border-radius:10px;
    padding:1.1rem 1.3rem;
    text-align:center;
  }
  .summary .big{
    font-size:1.8rem;
    font-weight:700;
    color:var(--purple);
  }
  .summary p{color:var(--muted);font-size:.9rem;margin:.3rem 0 0;}

  footer{
    text-align:center;
    color:var(--muted);
    font-size:.8rem;
    margin-top:2rem;
  }
</style>
</head>
<body>

<header>
  <img src="https://i.postimg.cc/FKz4sz2C/logoutelsinfondo.png" alt="UTEL">
  <div class="title-block">
    <h1>Checklist de Cierre</h1>
    <p class="subject">Módulo 4. La Dirección de Proyectos Fases 4 y 5 — Semana 4</p>
    <p class="meta">Profesor: Dr. Armando Sandoval Maravilla</p>
  </div>
</header>

<main>
  <p class="intro">Piensa en un proyecto tuyo, real o cercano. Marca sí o no para cada elemento del cierre.</p>

  <div id="groups"></div>

  <div class="summary">
    <div class="big"><span id="yesCount">0</span> / <span id="totalCount">0</span></div>
    <p>elementos de cierre que sí tienes</p>
  </div>
</main>

<footer>UTEL — Educación Continua</footer>

<script>
const groups = [
  {
    title: "Cierre administrativo",
    items: [
      "¿El cliente aceptó formalmente los entregables?",
      "¿Las cuentas del proyecto están cerradas?",
    ],
  },
  {
    title: "Cierre contractual",
    items: [
      "¿Los proveedores confirmaron por escrito la aceptación de su trabajo?",
      "¿Ya no hay reclamaciones abiertas con contratistas?",
    ],
  },
  {
    title: "Informe final",
    items: [
      "¿Existe un informe final con los resultados de alcance, costo y cronograma?",
      "¿Se documentaron los riesgos y cómo se resolvieron?",
    ],
  },
  {
    title: "Activos de la organización",
    items: [
      "¿Las lecciones aprendidas quedaron archivadas en algún repositorio?",
      "¿Los documentos de cierre y operación se entregaron a quien los va a usar?",
    ],
  },
];

const state = {};
let idCounter = 0;

const groupsWrap = document.getElementById("groups");
let total = 0;

groups.forEach(group => {
  const g = document.createElement("div");
  g.className = "group";
  const h2 = document.createElement("h2");
  h2.textContent = group.title;
  g.appendChild(h2);

  group.items.forEach(text => {
    total++;
    const id = "q" + (idCounter++);
    state[id] = null;

    const item = document.createElement("div");
    item.className = "item";
    item.innerHTML = `
      <p>${text}</p>
      <div class="toggle">
        <button data-id="${id}" data-val="si">Sí</button>
        <button data-id="${id}" data-val="no">No</button>
      </div>`;
    g.appendChild(item);
  });

  groupsWrap.appendChild(g);
});

document.getElementById("totalCount").textContent = total;

groupsWrap.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-id]");
  if (!btn) return;
  const id = btn.dataset.id;
  const val = btn.dataset.val;
  state[id] = val;

  const siblings = btn.parentElement.querySelectorAll("button");
  siblings.forEach(s => s.classList.remove("active-yes", "active-no"));
  btn.classList.add(val === "si" ? "active-yes" : "active-no");

  updateSummary();
});

function updateSummary() {
  const yes = Object.values(state).filter(v => v === "si").length;
  document.getElementById("yesCount").textContent = yes;
}
</script>
</body>
</html>
